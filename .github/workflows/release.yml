name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  musl-binary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build static musl binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl -p scb-check
      - name: Stage release assets
        run: |
          mkdir -p out
          cp target/x86_64-unknown-linux-musl/release/scb-check out/scb-check-x86_64-unknown-linux-musl
          ldd out/scb-check-x86_64-unknown-linux-musl 2>&1 | grep -qE "statically linked|not a dynamic executable"
          (cd out && sha256sum scb-check-x86_64-unknown-linux-musl > scb-check-x86_64-unknown-linux-musl.sha256)
      - name: Publish binary to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release create "$tag" --title "$tag" --generate-notes out/* \
            || gh release upload "$tag" out/* --clobber
