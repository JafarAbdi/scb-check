[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Root package = the pre-commit hook shim. It installs with no Rust toolchain by
# depending on the static musl `scb-check` wheel published to this repo's GitHub
# release (built from packaging/). The actual CLI lives in crates/scb-check.
[project]
name = "scb-check-hook"
version = "0.2.0"
description = "pre-commit hook wrapping the scb-check static musl binary."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
dependencies = [
    "scb-check @ https://github.com/JafarAbdi/scb-check/releases/download/v0.2.0/scb_check-0.2.0-py3-none-manylinux2014_x86_64.whl",
]

[project.urls]
Repository = "https://github.com/JafarAbdi/scb-check"

[tool.setuptools]
py-modules = []

[dependency-groups]
dev = [
    "hatchling==1.27.0",
    "pre-commit==4.6.0",
    "ruff==0.15.11",
    "ty==0.0.32",
    "vulture==2.16",
]

[tool.ty.src]
exclude = ["tests/fixtures/"]

[tool.scb-check]
exclude = ["scratch/**", "tests/**"]

[tool.ruff]
exclude = [".venv", ".gitignore", ".dockerignore"]
line-length = 80
target-version = "py312"
extend-exclude = ["tests/fixtures/", ".venv/*", ".pytest_cache/*"]
show-fixes = true

[tool.ruff.lint.isort]
case-sensitive = true
force-single-line = true
single-line-exclusions = ["typing"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "TC001",
    "TC003",
    "E501",
    "C408",
    "EM101",
    "EM102",
    "TRY003",
    "COM812"
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["E402"]
"tests/**.py" = [
    "S101",
    "D100",
    "INP001",
    "PLR2004",
    "ARG005",
    "FLY002",
]


[tool.ruff.lint.pydocstyle]
convention = "google"  # Options: "google", "numpy", or "pep257"

[tool.vulture]
paths = ["packaging/hatch_build.py"]
min_confidence = 80
exclude = [
    ".venv",
    ".pytest_cache",
    "scratch",
    "tests/fixtures",
]
